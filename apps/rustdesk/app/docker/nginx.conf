server {
    listen 21120;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 公钥。私钥 id_ed25519 也挂在 /keys 下，但没有为它开放任何路由，
    # 访问 /keys/... 会落到上面的 try_files，返回首页而不是文件内容
    location = /key {
        alias /keys/id_ed25519.pub;
        default_type text/plain;
        add_header Cache-Control "no-store";
        # 用户在向导里填了自定义 KEY 时，hbbs 不会生成 id_ed25519.pub，
        # 此时 alias 指向的文件不存在。返回纯文本 404（而不是 nginx 默认的
        # HTML 错误页），前端据此判定 ok=false 并继续轮询，
        # 同时页面已优先使用 meta.txt 里的自定义 KEY，显示不受影响。
        error_page 404 = @key_absent;
    }

    location @key_absent {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 404 "key file not generated (custom KEY in use, or hbbs still starting)\n";
    }
}
