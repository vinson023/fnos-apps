services:
  music-dl:
    image: guohuiyuan/go-music-dl:latest
    container_name: music-dl
    restart: always
    command: ["./music-dl", "web", "--port", "8080", "--no-browser"]
    ports:
      - "8099:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 下载落盘目录（宿主机音乐库）
      - ${DOWNLOAD_DIR:-/vol1/1000/Download}:/home/appuser/data/downloads
      # 配置/缓存/日志目录
      - ${FNOS_DATA_DIR:-/vol1/1000/docker}/music-dl:/home/appuser/data
