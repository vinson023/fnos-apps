services:
  music-dl:
    image: guohuiyuan/go-music-dl:latest
    container_name: music-dl
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # 网络模式由安装向导决定（host / bridge），见 wizard/install。
    network_mode: ${wizard_network_mode}
    # 显式指定启动参数：web 模式、监听用户在向导里选的端口、不自动打开浏览器
    command: ["./music-dl", "web", "--port", "${wizard_web_port}", "--no-browser"]
    ports:
      # host 模式下 Docker 会忽略这两行（只打印一条 warning），bridge 模式下生效。
      # 前后端口号相同，所以两种模式对外是同一个端口。
      - "${wizard_web_port}:${wizard_web_port}"
    environment:
      # 时区，影响日志与歌曲元数据里的时间
      - TZ=Asia/Shanghai
    volumes:
      # 下载落盘目录（宿主机音乐库），安装向导里选的 wizard_download_dir
      - ${wizard_download_dir}:/home/appuser/data/downloads
      # 配置/缓存/日志目录
      - ${wizard_data_dir}:/home/appuser/data
