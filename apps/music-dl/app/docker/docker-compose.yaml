services:
  music-dl:
    image: guohuiyuan/go-music-dl:latest
    container_name: music-dl
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # 显式指定启动参数：web 模式、容器内监听 8080、不自动打开浏览器
    command: ["./music-dl", "web", "--port", "8080", "--no-browser"]
    ports:
      # 宿主机 8099 -> 容器内 8080。端口被占用时安装会失败（manifest 里 checkport=true）
      - "8099:8080"
    environment:
      # 时区，影响日志与歌曲元数据里的时间
      - TZ=Asia/Shanghai
    volumes:
      # 下载落盘目录（宿主机音乐库）
      - ${DOWNLOAD_DIR:-/vol1/1000/Download}:/home/appuser/data/downloads
      # 配置/缓存/日志目录
      - ${FNOS_DATA_DIR:-/vol1/1000/docker}/music-dl:/home/appuser/data
