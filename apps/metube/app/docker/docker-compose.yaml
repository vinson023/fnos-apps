services:
  metube:
    # 基于 yt-dlp 的自托管视频下载器，Web 界面提交链接、管理下载队列
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # 网络模式由安装向导决定（host / bridge），见 wizard/install。
    # host：PORT 直接占用宿主机端口，没有 NAT，yt-dlp 下载也不多绕一层。
    # bridge：容器隔离，端口通过下面的 ports 映射出去。
    network_mode: ${wizard_network_mode}
    ports:
      # host 模式下 Docker 会忽略这两行（只打印一条 warning），bridge 模式下生效。
      # 前后端口号相同，所以两种模式对外是同一个端口。
      - "${wizard_web_port}:${wizard_web_port}"
    environment:
      # 时区，影响下载任务与日志时间
      - TZ=Asia/Shanghai
      # 容器内实际运行身份。entrypoint 以 root 启动、chown 数据目录后
      # 用 gosu 降权到该 UID:GID，因此必须与下载目录的属主一致
      - PUID=1000
      - PGID=1000
      # 新建文件的权限掩码，022 表示组内与其他用户可读
      - UMASK=022
      # 容器内监听端口 = 用户在向导里选的端口。
      # 和 ports 用同一个变量，host/bridge 两种模式对外端口天然一致
      - PORT=${wizard_web_port}
      # 成品落盘目录（容器内路径）
      - DOWNLOAD_DIR=/downloads
      # 队列状态与配置的持久化目录（容器内路径）
      - STATE_DIR=/config
      # 下载中的临时文件目录。与成品同盘可避免合并时跨设备拷贝
      - TEMP_DIR=/downloads
    volumes:
      # 下载成品目录（宿主机）。安装向导里选的 wizard_download_dir
      - ${wizard_download_dir}:/downloads
      # 配置与队列状态，删除会丢失下载历史与全部设置
      - ${wizard_data_dir}/config:/config
      # 跟随宿主机时区
      - /etc/localtime:/etc/localtime:ro
    # 说明：此处不设 mem_limit 与 cap_drop。
    # entrypoint 需要 root 权限对数据目录做 chown，再用 gosu 降权；
    # 合并大体积视频时内存占用也会明显抬升，加硬上限容易 OOM 失败
