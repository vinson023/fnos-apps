services:
  omnibox:
    # 自托管多媒体聚合平台：影视 / 直播 / 音乐 / 听书 / 短剧 + 网盘资源
    # 版本标签由安装向导决定（beta = v3.x 主线，latest = v2.x 稳定线），见 wizard/install
    image: lampon/omnibox:${wizard_image_tag}
    container_name: omnibox
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # 网络模式由安装向导决定（host / bridge）。
    # 两种模式下端口都是用户填的那个，因为下面用 SERVER_PORT 让进程自己监听这个号。
    network_mode: ${wizard_network_mode}
    ports:
      # host 模式下 Docker 会忽略这行（只打印一条 warning），端口由进程直接监听
      - "${wizard_web_port}:${wizard_web_port}"
    environment:
      # 时区，影响直播节目单（EPG）与录制文件时间
      - TZ=Asia/Shanghai
      # 进程实际监听的端口。必须是 SERVER_PORT —— 单独的 PORT 无效（实测过），
      # 二进制里没有别的开关，所以这是让容器内监听端口跟着向导走的唯一途径
      - SERVER_PORT=${wizard_web_port}
      # 爬虫 SDK（/app/static/sdk/omnibox_sdk.py 与 .js）默认连
      # http://localhost:7023/api/spider/omnibox。端口一改，导入的爬虫脚本就找不到后端，
      # 所以显式覆盖成用户选的端口（SDK 优先读 OMNIBOX_API_URL）
      - OMNIBOX_API_URL=http://127.0.0.1:${wizard_web_port}/api/spider/omnibox
    volumes:
      # /app/data 里放 SQLite 数据库、爬虫脚本及其 node_modules、.pip_packages、
      # 网盘授权令牌和缓存。镜像把 NODE_PATH / PYTHONPATH 都指向这里，
      # 所以这个目录必须持久化，否则重建容器等于全新安装。
      - ${wizard_data_dir}:/app/data
