services:
  ariang:
    image: nginx:alpine
    container_name: ariang
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${TRIM_APPDEST}/docker/html:/usr/share/nginx/html:ro
      - ${TRIM_APPDEST}/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
