services:
  ariang:
    # 只做静态托管和反代，不需要 PHP/Node 等运行时，nginx:alpine 体积最小
    image: nginx:alpine
    container_name: ariang
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # host 模式：与宿主机共用网络栈，才能直接反代 127.0.0.1:6800 上的 aria2；
    # 同时也避开了端口映射在 IPv4/IPv6 双栈下的差异（外网访问依赖这一点）
    network_mode: host
    environment:
      # 时区，影响日志时间与下载任务的时间显示
      - TZ=Asia/Shanghai
      # aria2 的 RPC 地址（主机:端口），来自安装向导。
      # 供 nginx 启动时的 envsubst 使用，替换模板里的 ${ARIA2_RPC}
      - ARIA2_RPC=${wizard_aria2_rpc}
      # envsubst 白名单：只替换 ARIA2_RPC 这一个变量。
      # 不加这行的话，模板里的 $remote_addr / $uri / $scheme 等 nginx 内置变量
      # 会被一并替换成空值，配置直接失效
      - NGINX_ENVSUBST_FILTER=ARIA2_RPC
    volumes:
      # AriaNg 静态站随包分发，不依赖宿主机外部目录。
      # ${TRIM_APPDEST} 是 fnOS 注入的安装路径，实际为 /vol1/@appcenter/ariang
      - ${TRIM_APPDEST}/docker/html:/usr/share/nginx/html:ro
      # 反代配置模板：nginx 镜像启动时用 envsubst 渲染到 /etc/nginx/conf.d/default.conf。
      # 用相对路径反代后，内网 IP / 外网域名 / IPv4 / IPv6 都能共用同一份配置
      - ${TRIM_APPDEST}/docker/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 跟随宿主机时区
      - /etc/localtime:/etc/localtime:ro
    # 纯静态文件托管，128MB 绰绰有余
    mem_limit: 128m
    security_opt:
      # 禁止容器内进程通过 setuid/setgid 提权
      - no-new-privileges:true
