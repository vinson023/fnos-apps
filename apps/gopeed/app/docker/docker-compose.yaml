services:
  gopeed:
    # Gopeed：Go + Flutter 写的下载器，支持 HTTP / BitTorrent / 磁力 / ed2k，
    # 镜像里自带 Web 界面（前端编译进二进制），无外部依赖
    image: liwei2633/gopeed:${wizard_image_tag}
    container_name: gopeed
    # 异常退出或宿主机重启后自动拉起
    restart: unless-stopped
    # 网络模式由安装向导决定（host / bridge）。两种模式下端口都是用户填的那个，
    # 因为下面用 GOPEED_PORT 让进程自己监听这个号（不是只在宿主机侧映射）。
    network_mode: ${wizard_network_mode}
    ports:
      # host 模式下 Docker 会忽略这行（只打印一条 warning），端口由进程直接监听
      - "${wizard_web_port}:${wizard_web_port}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        # 上游 entrypoint 是 `chown -R /app`。下载目录挂进来以后，这等于每次启动
        # 都把整个下载库的 inode 全扫一遍 —— 库大了（几十万文件）重启会明显变慢。
        # 这里只把两个挂载点「目录本身」的属主改掉：进程本来就以 PUID 运行，
        # 它自己新建的文件天生就是对的属主，不需要全树 chown。
        chown $${PUID}:$${PGID} /app/storage /app/Downloads 2>/dev/null || true
        umask $${UMASK}
        exec su-exec $${PUID}:$${PGID} ./gopeed
    environment:
      # 时区，影响任务列表里的时间显示与日志
      - TZ=Asia/Shanghai
      # 以 admin(1000:1000) 身份下载，文件属主和 aria2 / 迅雷一致，
      # 在飞牛「文件管理」里能直接改名 / 删除，不会变成 root 的东西
      - PUID=1000
      - PGID=1000
      - UMASK=022
      # 监听端口 = 用户填的端口。GOPEED_ 前缀的环境变量直接映射成配置项，
      # 所以两种网络模式下端口都是真正可改的（实测 18888 生效）
      - GOPEED_PORT=${wizard_web_port}
      # Web 界面账号密码。密码一旦设置就会启用登录，不设就是裸奔 ——
      # gopeed 官方文档明确说暴露在公网必须开认证
      - GOPEED_USERNAME=${wizard_username}
      - GOPEED_PASSWORD=${wizard_password}
    volumes:
      # 下载目录。挂到 /app/Downloads 是上游约定的位置，
      # 也让 gopeed 默认的下载目录直接落在这里
      - ${wizard_download_dir}:/app/Downloads
      # 数据目录：gopeed.db（SQLite，任务记录 + 全部设置）、logs/
      - ${wizard_data_dir}:/app/storage

  gopeed-fwd:
    # 桌面图标的「端口兜底」。
    #
    # 飞牛在安装那一刻就把访问地址写进系统数据库（appcenter.app_service.url），
    # 拼的是包里 ui/config 的 port —— 那就是 9999，不理会向导里填了什么。
    # 所以用户把端口改成 6882 之后，直接在浏览器访问 6882 是好的，
    # 但桌面图标仍然去 9999，打不开。而这条记录：
    #   · ui/config 里写 ${wizard_web_port} 占位符 —— 装不上（appcenter code 10237）
    #   · 生命周期脚本改库 —— cmd/* 以应用用户跑，psql 没密码
    #   · appcenter-cli 改 service —— 没有这个子命令
    # 三条路都堵死，于是在 9999 上放一个转发器：图标打 9999 → 转到用户真实端口。
    # 这样「端口可改」和「图标能用」同时成立，用户不用再管数据库。
    image: alpine/socat:latest
    container_name: gopeed-fwd
    restart: unless-stopped
    # 用 host 网络：bridge 模式下宿主机已映射了用户端口，host 模式下进程直接监听，
    # 两种情况 127.0.0.1:${wizard_web_port} 都通
    network_mode: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "${wizard_web_port}" = "9999" ]; then
          # 用户选的就是图标端口，不需要转发（否则会跟 gopeed 抢 9999）
          echo "[gopeed-fwd] 端口即 9999，无需转发"
          exec sleep infinity
        fi
        echo "[gopeed-fwd] 桌面图标 9999 -> 127.0.0.1:${wizard_web_port}"
        exec socat TCP-LISTEN:9999,fork,reuseaddr TCP:127.0.0.1:${wizard_web_port}
