server {
    listen 6880;
    listen [::]:6880;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 静态资源与语言文件都不缓存：升级 fpk 后刷新即生效，
    # 不会被浏览器或 webview 里的旧文件卡住
    location ~* \.(js|css|html|txt)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 语言文件必须严格按文件名取，缺失就老实返回 404。
    # 不能落到下面的 try_files 兜底上——那样会把 index.html 当语言文件返回，
    # AriaNg 解析失败后整站退回英文。
    location /langs/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 服务端配置（RPC 地址/端口/密钥）绝不能缓存：改完刷新就要生效。
    # 缺失时必须老实 404——被下面的 try_files 兜底成 index.html 的话，
    # 浏览器会拿一段 HTML 当 JS 执行，配置静默失效。
    location = /rpc-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
