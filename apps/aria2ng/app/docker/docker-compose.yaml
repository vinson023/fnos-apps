services:
  aria2ng:
    # 纯静态站点，不需要 PHP/Node 等运行时，nginx:alpine 体积最小
    image: nginx:alpine
    container_name: aria2ng
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # host 模式：直接占用宿主机 6880，不用端口映射，
    # 也避开了端口映射在 IPv4/IPv6 双栈下的差异
    network_mode: host
    environment:
      # 时区，影响日志时间
      - TZ=Asia/Shanghai
    volumes:
      # AriaNg 静态站随包分发，不依赖宿主机外部目录。
      # ${TRIM_APPDEST} 是 fnOS 注入的安装路径，实际为 /vol1/@appcenter/aria2ng
      - ${TRIM_APPDEST}/docker/html:/usr/share/nginx/html:ro
      # 站点配置：只做静态托管，不含任何反向代理。
      # AriaNg 直接以浏览器的身份去连 aria2 的 RPC 端口（aria2 自带 CORS 头）
      - ${TRIM_APPDEST}/docker/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 跟随宿主机时区
      - /etc/localtime:/etc/localtime:ro
    # 纯静态文件托管，128MB 绰绰有余
    mem_limit: 128m
    security_opt:
      # 禁止容器内进程通过 setuid/setgid 提权
      - no-new-privileges:true
