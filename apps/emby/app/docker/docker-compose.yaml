services:
  embyserver:
    # 第三方构建的 Emby Server 镜像，自带硬件转码依赖
    image: amilys/embyserver:latest
    container_name: embyserver
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # 网络模式由安装向导决定（host / bridge），见 wizard/install。
    # 注意：Emby 的端口不开放修改。它把端口写在 /config/config/system.xml 的
    # HttpServerPortNumber 里，启动脚本又把参数写死了、不接收 compose 的 command，
    # 硬改会连带破坏 DLNA / 局域网自动发现，所以这里固定 8096。
    # 真的撞端口了，请停掉应用后改 system.xml 里的 HttpServerPortNumber。
    network_mode: ${wizard_network_mode}
    ports:
      # host 模式下 Docker 会忽略这行（只打印一条 warning），bridge 模式下生效
      - "8096:8096"
    environment:
      # 时区，影响媒体库扫描时间与日志
      - TZ=Asia/Shanghai
      # 以 root 运行（0:0）。改为具体 UID/GID 可避免媒体文件权限问题，
      # 但要求宿主机上的媒体目录属主与之匹配，否则容器内读不到
      - PUID=0
      - PGID=0
    volumes:
      # Emby 的配置、元数据、转码缓存，建议保留在 SSD 上（安装向导里选的 wizard_data_dir）
      - ${wizard_data_dir}/config:/config
      # 媒体库目录，只读也可，这里保持默认读写以便 Emby 整理文件
      - ${wizard_media_dir}:/media
