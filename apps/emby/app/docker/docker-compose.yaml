services:
  embyserver:
    # 第三方构建的 Emby Server 镜像，自带硬件转码依赖
    image: amilys/embyserver:latest
    container_name: embyserver
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # host 模式：Emby 需要局域网自动发现（DLNA/投屏）并对外提供服务端口 8096，
    # 桥接模式会让发现功能失效
    network_mode: host
    environment:
      # 时区，影响媒体库扫描时间与日志
      - TZ=Asia/Shanghai
      # 以 root 运行（0:0）。改为具体 UID/GID 可避免媒体文件权限问题，
      # 但要求宿主机上的媒体目录属主与之匹配，否则容器内读不到
      - PUID=0
      - PGID=0
    volumes:
      # Emby 的配置、元数据、转码缓存，建议保留在 SSD 上
      - ${FNOS_DATA_DIR:-/vol1/1000/docker}/emby/config:/config
      # 媒体库目录，只读也可，这里保持默认读写以便 Emby 整理文件
      - ${MEDIA_DIR:-/vol1/1000/video}:/media
