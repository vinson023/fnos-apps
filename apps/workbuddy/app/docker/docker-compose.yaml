services:
  # ── 上游网关：账号池 + OpenAI 兼容反代（Go）──────────────────────────────
  # 网络模式由安装向导决定（host / bridge）。管理端用 network_mode: "service:…"
  # 跟它共用同一个网络命名空间，两个容器因此始终在同一个 netns 里，
  # 管理端连上游可以固定用 127.0.0.1，两种模式都不用改地址。
  workbuddy2api:
    image: ghcr.io/ithtelab/workbuddy2api:${wizard_image_version}
    container_name: workbuddy2api
    # 异常退出或宿主机重启后自动拉起。
    # 注意：管理端的「一键更新」依赖进程退出后由 restart 策略拉新代码，
    # 但那是「容器内改文件」的玩法；本包用镜像部署，重建容器就会回到镜像版本。
    restart: unless-stopped
    # 镜像默认以 uid 10001(app) 运行，但飞牛存储池是 ext4 + trimacl：
    # 宿主机建出来的目录属主是 root、mode 常常是 000，uid 10001 写不进去
    #（症状是 sqlite / auths 读写失败，或账号列表恒为 0 个）。
    # 统一用 root，省掉装完后还要跨 uid chown 的步骤。
    user: "0:0"
    network_mode: ${wizard_network_mode}
    ports:
      # 端口要发布在「持有网络命名空间的那个服务」上 —— 也就是这里，
      # 因为管理端用的是 network_mode: "service:workbuddy2api"。
      # host 模式下 Docker 会忽略这段（只打印一条 warning），端口由进程直接监听。
      - "${wizard_web_port}:${wizard_web_port}"
    # 配置里的 auth_dir / state_file 都是相对路径（./auths、./data/state.json），
    # 把工作目录指到挂载点，配置、账号、状态就都落在数据目录里
    working_dir: /app/state
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /app/state/auths /app/state/data
        if [ ! -s /app/state/config.json ]; then
          # 首次启动：用镜像内置的默认配置打底。
          # 镜像里 api_key 是占位值 test_key，换成随机串
          #（7863 不对外发布，但默认密钥留着没有好处）
          cp /app/config.json /app/state/config.json
          KEY=$$(head -c 32 /dev/urandom | sha256sum | cut -c1-48)
          sed -i "s/\"api_key\": *\"[^\"]*\"/\"api_key\": \"$$KEY\"/" /app/state/config.json
        fi
        exec /app/wb2api -config /app/state/config.json
    environment:
      # 时区，影响定时签到 / 保活任务的执行时刻
      - TZ=Asia/Shanghai
    volumes:
      # config.json（含上游 api_key）、auths/（每账号一个 JSON）、data/state.json
      - ${wizard_data_dir}/upstream:/app/state

  # ── 管理端：Web 控制台 + 对外网关（Python/FastAPI）───────────────────────
  workbuddy-manager:
    image: ghcr.io/ithtelab/workbuddy-manager:${wizard_image_version}
    container_name: workbuddy-manager
    restart: unless-stopped
    user: "0:0"
    depends_on:
      - workbuddy2api
    # 与上游共用一个 netns：这样 127.0.0.1:7863 在 host / bridge 两种模式下都成立，
    # 既不用 host.docker.internal，也不用把 7863 映射到宿主机。
    # 代价是端口必须发布在上面 workbuddy2api 的 ports 里（已处理）。
    network_mode: "service:workbuddy2api"
    # 镜像默认 CMD 把端口写死成 7864，这里覆盖成向导里选的端口 ——
    # host 模式下没有端口映射，进程必须自己监听用户选的端口，
    # 所以 CMD 和 WB_MANAGER_PORT 一起改，保持前后端口号一致。
    command:
      - python
      - -m
      - uvicorn
      - server.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "${wizard_web_port}"
      - --timeout-graceful-shutdown
      - "20"
    environment:
      # 首次启动写入的管理员密码（用户名固定 admin，至少 12 位）。
      # 之后在「设置 → 管理用户」里改。
      - WB_ADMIN_PASSWORD=${wizard_admin_password}
      # 与上游同 netns，固定回环地址，两种网络模式通用
      - WB2API_BASE=http://127.0.0.1:7863
      # 和 --port 保持一致，避免界面里显示的端口和实际监听的对不上
      - WB_MANAGER_PORT=${wizard_web_port}
      # 生产环境不暴露 Swagger（/docs 与 /openapi.json）
      - WB_ENABLE_DOCS=0
      # 不给 WB_TRUST_PROXY：本包是「NAS 直连 + 路由器端口映射」的拓扑，
      # 前面没有 HTTP 反代，采信 X-Real-IP 等于让客户端可以伪造来源 IP，
      # 会连带影响全局 IP 白/黑名单与登录失败锁定。
      # 以后若在前面加了 nginx / 1Panel 之类的七层反代，再加 WB_TRUST_PROXY=1。
    volumes:
      # SQLite（manager.db）、users.json（含会话密钥）、更新状态
      - ${wizard_data_dir}/manager:/app/data
      # 管理端通过这两个固定路径读写上游：
      #   WB_AUTH_DIR=/opt/workbuddy2api/auths
      #   WB_UPSTREAM_CONFIG=/opt/workbuddy2api/config.json
      # 所以把同一个数据目录再挂到 /opt/workbuddy2api，两边看到的是同一份文件
      - ${wizard_data_dir}/upstream:/opt/workbuddy2api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${wizard_web_port}/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首启要建库、装默认用户，给足时间
      start_period: 30s
