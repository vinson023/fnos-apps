services:
  reclip:
    image: heizicao/reclip:latest
    container_name: reclip
    restart: always
    network_mode: host
    user: "0:0"
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
    volumes:
      - ${FNOS_DATA_DIR:-/vol1/1000/docker}/reclip/reclip_data:/app/data:rw
      - /etc/localtime:/etc/localtime:ro
    mem_limit: 1g
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: false
