services:
  reclip:
    # 免费视频/音频解析下载工具
    image: reclipd/reclip:latest
    container_name: reclip
    # 异常退出或宿主机重启后自动拉起
    restart: always
    # 网络模式由安装向导决定（host / bridge），见 wizard/install
    network_mode: ${wizard_network_mode}
    ports:
      # host 模式下 Docker 会忽略这两行（只打印一条 warning），bridge 模式下生效。
      # 前后端口号相同，所以两种模式对外是同一个端口。
      - "${wizard_web_port}:${wizard_web_port}"
    # 镜像默认的 Cmd 把端口写死成 0.0.0.0:8899，这里整条覆盖掉，
    # 把绑定端口换成用户选的端口。参数与镜像原有 Cmd 保持一致，
    # 只替换最后的 -b 地址，避免镜像升级后参数对不上。
    command:
      - "gunicorn"
      - "--workers=2"
      - "--threads=2"
      - "--worker-tmp-dir"
      - "/dev/shm"
      - "-b"
      - "0.0.0.0:${wizard_web_port}"
      - "app:app"
    # 以 root 运行，便于写宿主机上的下载目录
    user: "0:0"
    environment:
      # 运行身份，与上面的 user 保持一致
      - PUID=0
      - PGID=0
      # 时区，影响日志与下载任务时间
      - TZ=Asia/Shanghai
    volumes:
      # 下载数据与配置文件目录，安装向导里选的 wizard_data_dir
      - ${wizard_data_dir}/reclip_data:/app/data:rw
      # 跟随宿主机时区
      - /etc/localtime:/etc/localtime:ro
    # 内存上限 1GB，避免长时间下载把宿主机内存吃满
    mem_limit: 1g
    # CPU 相对权重 512（默认 1024），让它在满载时让出优先级给其他服务
    cpu_shares: 512
    security_opt:
      # 禁止容器内进程通过 setuid/setgid 提权
      - no-new-privileges:true
    cap_drop:
      # 先清空所有 capabilities，再按需最小化放开
      - ALL
    cap_add:
      # 修改文件属主 / 绕过文件读写权限检查 / 改属组 / 改用户 / 绑定低端口
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    # 根文件系统保持可写（下载过程需要写临时文件）
    read_only: false
